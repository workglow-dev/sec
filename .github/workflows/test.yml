name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || (github.event_name == 'workflow_dispatch' && github.run_id || github.ref_name) }}
  cancel-in-progress: true

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # The Bun pinned by `packageManager`, not `latest`: `typecheck` is
      # `bun check`, so a Bun release can change a run's result on a commit
      # that did not change. `bun-latest.yml` watches for that drift.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun i
      # The gate list `release` runs, from the one script both call
      # (`scripts/releaseChecks.ts`); each gate is its own log group. lint needs
      # no build of its own: the type-aware rules resolve `@workglow/*` through
      # the published `dist/*.d.ts` that `bun i` already put in node_modules.
      - run: bun run release-checks
